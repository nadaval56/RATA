<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- תבנית תמונת ה-OG (1200x630). מרונדרת ל-assets/og/cover.jpg על ידי render.py.
     הפלטה זהה לפלטת האתר, כדי שהתצוגה המקדימה תיראה כמו הדף שנפתח אחרי הקליק. -->
<style>
@font-face{font-family:'Heebo';font-weight:100 900;src:url(../../assets/fonts/heebo-300-hebrew.woff2) format('woff2');}
@font-face{font-family:'HeeboLatin';font-weight:100 900;src:url(../../assets/fonts/heebo-300-latin.woff2) format('woff2');}
@font-face{font-family:'Suez One';src:url(../../assets/fonts/suezone-400-hebrew.woff2) format('woff2');}
@font-face{font-family:'Suez One';src:url(../../assets/fonts/suezone-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF;}
@font-face{font-family:'Plex';font-weight:600;src:url(../../assets/fonts/ibmplexmono-600-latin.woff2) format('woff2');}

:root{
  --paper:#F4F2EC; --surface:#FFFFFF; --ink:#1F1E1D; --ink-2:#4F4D48; --ink-3:#66645E;
  --hair:#DEDAD0; --hair-2:#ECE9E1; --magenta:#B4326D; --tint-mag:#FAEEF3;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{background:var(--paper);font-family:'Heebo','HeeboLatin',sans-serif;overflow:hidden;position:relative}

.stage{position:absolute;inset:0;display:flex;align-items:center;padding:0 76px;gap:44px}

.txt{width:540px;flex:none}
.pill{
  display:inline-block;font-weight:700;font-size:21px;color:var(--magenta);
  background:var(--tint-mag);border-radius:999px;padding:7px 20px;margin-bottom:24px;
}
h1{font-family:'Suez One',serif;font-size:86px;line-height:1.06;color:var(--ink);letter-spacing:-.01em}
.sub{font-size:31px;line-height:1.42;color:var(--ink-2);font-weight:400;margin-top:20px}

/* שורת המספרים, בכרטיס לבן כמו באתר. לעדכן כאן כשהתוכן גדל, ואז להריץ שוב את render.py */
.meta{
  margin-top:32px;display:flex;gap:0;direction:rtl;
  background:var(--surface);border:1.5px solid var(--hair-2);border-radius:22px;overflow:hidden;
}
.meta>div{flex:1;text-align:center;padding:18px 10px 16px}
.meta>div+div{border-inline-start:1.5px solid var(--hair-2)}
.meta .n{font-family:'Plex',monospace;font-weight:600;font-size:36px;color:var(--ink);line-height:1;direction:ltr}
.meta .l{font-size:19px;color:var(--ink-3);margin-top:8px}

.art{flex:1;display:flex;align-items:center;justify-content:center}
.art .tile{
  width:420px;height:420px;border-radius:44px;background:var(--surface);
  border:1.5px solid var(--hair-2);display:flex;align-items:center;justify-content:center;
}
.art img{width:330px;height:auto;display:block}

.url{
  position:absolute;bottom:30px;left:76px;font-family:'Plex',monospace;font-weight:600;
  font-size:20px;color:var(--ink-3);direction:ltr;
}
</style>
</head>
<body>



<div class="stage">
  <div class="txt">
    <div class="pill">חינם · בעברית · עובד גם אופליין</div>
    <h1>לעוף לשמיים</h1>
    <div class="sub">הכנה לבחינה העיונית של רת&quot;א<br>לרישיון מטיס כטב&quot;ם קטן</div>
    <div class="meta">
      <div><div class="n">204</div><div class="l">שאלות</div></div>
      <div><div class="n">170</div><div class="l">כרטיסיות</div></div>
      <div><div class="n">6</div><div class="l">נושאים</div></div>
    </div>
  </div>

  <div class="art"><div class="tile"><img src="logo-mark.png" alt=""></div></div>
</div>

<div class="url">dronexam.co.il</div>
</body>
</html>
